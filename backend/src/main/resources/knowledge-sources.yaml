# The authoritative declaration of every external knowledge source.
#
# Nothing is downloadable unless it is declared here: the ingester refuses any URL whose
# host is not on a source in this file. Source URLs and licence terms live here and only
# here, so they cannot drift apart across the codebase.
#
# LICENCE BOUNDARY. The application's own source code is MIT (see /LICENSE). Nothing in
# this file is MIT. Each source keeps its own upstream licence, and that licence travels
# with every document, chunk, embedding, harmony record and export derived from it.
# Ingesting, normalising, chunking, embedding or indexing material does not relicense it.
#
# Every licence below was verified against the authoritative upstream source on
# 2026-08-31. Where a corpus states its own licence, that statement wins over any
# assumption inherited from a parent repository.

sources:

  - id: open-music-theory
    name: Open Music Theory
    version: "2"
    description: >-
      An open music theory textbook and workbook covering fundamentals, diatonic and
      chromatic harmony, form, counterpoint, jazz, popular music and 20th-century
      techniques.
    sourceUrl: https://viva.pressbooks.pub/openmusictheory/
    apiBase: https://viva.pressbooks.pub/openmusictheory/wp-json/pressbooks/v2
    publisher: Pressbooks (VIVA)
    authors:
      - Mark Gotham
      - Kyle Gullings
      - Chelsey Hamm
      - Bryn Hughes
      - Brian Jarvis
      - Megan Lavengood
      - John Peterson
    editors:
      - Erin K. Maher
    citation: >-
      Gotham, M., Gullings, K., Hamm, C., Hughes, B., Jarvis, B., Lavengood, M., &
      Peterson, J. (2023). Open Music Theory (Version 2), ed. E. K. Maher. VIVA
      Pressbooks. https://viva.pressbooks.pub/openmusictheory/
    license: CC-BY-SA-4.0
    ingestionMode: TEXT_RAG
    tradition: GENERAL
    enabled: true
    # The book-level licence is CC BY-SA 4.0, but individual chapters are NOT all under
    # it: one is CC BY-NC-SA 4.0 and one is All Rights Reserved. Chapter licences come
    # from the Pressbooks API per chapter and are checked individually before ingest.
    perResourceLicense: true

  # ------------------------------------------------------------------ DCML corpora
  # Structured harmonic annotations, ingested as data rather than as prose.
  # Every corpus below states CC BY-NC-SA 4.0 in its own LICENSE file.

  - id: dcml-beethoven-string-quartets
    name: Annotated Beethoven Corpus (string quartets)
    repository: https://github.com/DCMLab/ABC
    branch: main
    composer: Ludwig van Beethoven
    citation: >-
      Neuwirth, M., Harasim, D., Moss, F. C., & Rohrmeier, M. (2018). The Annotated
      Beethoven Corpus (ABC): A Dataset of Harmonic Analyses of All Beethoven String
      Quartets. Frontiers in Digital Humanities, 5(July), 1-5.
      https://doi.org/10.3389/fdigh.2018.00016
    license: CC-BY-NC-SA-4.0
    ingestionMode: STRUCTURED_HARMONY
    tradition: CLASSICAL
    enabled: true

  - id: dcml-mozart-piano-sonatas
    name: The Annotated Mozart Sonatas
    repository: https://github.com/DCMLab/mozart_piano_sonatas
