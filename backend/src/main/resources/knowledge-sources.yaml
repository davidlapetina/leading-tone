  # ------------------------------------------------------------------ jazz
  - id: jazz-harmony-treebank
    name: Jazz Harmony Treebank
    repository: https://github.com/DCMLab/JazzHarmonyTreebank
    branch: master
    dataFile: treebank.json
    description: >-
      Hierarchical harmonic analyses of jazz standards. 1170 tunes carry chords,
      measures, beats, key and meter; 150 of them additionally carry constituent trees
      and 241 carry turnaround annotations.
    citation: >-
      Harasim, D., Finkensiep, C., Ericson, P., O'Donnell, T. J., & Rohrmeier, M. (2020).
      The Jazz Harmony Treebank. Proceedings of the 21st International Society for Music
      Information Retrieval Conference, 207-215. https://doi.org/10.5281/zenodo.4245406
    license: CC-BY-NC-SA-4.0
    ingestionMode: STRUCTURED_HARMONY
    tradition: JAZZ
    enabled: true

