quarkus.application.name=music-teacher
# Off the usual 8080 so this can run alongside another service.
quarkus.http.port=${MUSIC_HTTP_PORT:8088}

# The Vite dev server and its preview server.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:4173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=content-type,accept

# ---------------------------------------------------------------- database
# Progress is kept in an H2 file under ./data. There is no database server to install, no
# container to run, and nothing to configure: start the application and your work is saved.
# Flyway owns the schema; Hibernate only validates that the mapping still fits it.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=tutor
quarkus.datasource.password=tutor
quarkus.datasource.jdbc.url=jdbc:h2:file:${MUSIC_DATA_DIR:./data}/leading-tone;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.datasource.devservices.enabled=false

# Tests run against an in-memory database, so the suite needs nothing installed at all.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:leading-tone;DB_CLOSE_DELAY=-1
%test.quarkus.flyway.clean-at-start=true

# ---------------------------------------------------------------- language model
# Local by default: no keys, no network, and the application still runs without it.
quarkus.langchain4j.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
# qwen3:8b is the default because it fits in 16GB and still handles tool calls. Where more
# memory is available, qwen3:30b-a3b teaches noticeably better; it is one variable away.
# A colon inside a default value has to be escaped, or "qwen3" would be read as the
# default and ":8b" as a nested one.
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_MODEL:qwen3\:8b}
# A little warmth, because at 0.6 the model settles into one stock phrasing and repeats it
# across turns that look alike to it.
quarkus.langchain4j.ollama.chat-model.temperature=${OLLAMA_TEMPERATURE:0.8}

# Qwen3 is a reasoning model and thinks before every turn by default. Measured on this
# prompt: 7.0s with reasoning, 1.7s without — and the reply without it was better, because
# the model spent its budget on teaching rather than on deliberating about teaching.
quarkus.langchain4j.ollama.chat-model.model-options.think=${OLLAMA_THINK:false}

# The default 4096 is not enough once tool schemas and a conversation window are added, and
# overflowing it makes every later turn slower than the one before.
quarkus.langchain4j.ollama.chat-model.model-options.num-ctx=${OLLAMA_NUM_CTX:8192}
quarkus.langchain4j.ollama.chat-model.model-options.repeat-penalty=1.15
# A local model that has to load 14GB from disk can take minutes on its first call, and
# the client retries once before giving up. Blocking a learner that long is worse than a
# plainer turn, so the timeout is short and failures open a cooldown window instead.
quarkus.langchain4j.ollama.timeout=${OLLAMA_TIMEOUT:60s}
music.llm.failure-cooldown=${MUSIC_LLM_COOLDOWN:PT2M}
quarkus.langchain4j.ollama.log-requests=false
quarkus.langchain4j.ollama.log-responses=false
quarkus.langchain4j.ollama.devservices.enabled=false

# Tool calling needs the model to see its own tool results, so the conversation is kept
# in a per-session memory window. The durable record stays in the interaction table.
quarkus.langchain4j.chat-memory.memory-window.max-messages=10

# Set to false to run the whole tutor deterministically, with templates instead of prose.
music.llm.enabled=${MUSIC_LLM_ENABLED:true}

# The default model handles tool calling. Small models tend to type the call out as text
# instead; set this false for those. Either way a reply that arrives as markup rather than
# prose is rejected rather than read out to the learner.
music.llm.tools-enabled=${MUSIC_LLM_TOOLS:true}
%test.music.llm.tools-enabled=false
%test.music.llm.enabled=false

music.learner.default-name=${MUSIC_LEARNER_NAME:Student}

# Lets the end-to-end tests start a scenario from an empty learner model. Off in production.
music.dev.allow-reset=false
%dev.music.dev.allow-reset=true
%test.music.dev.allow-reset=true

# ---------------------------------------------------------------- observability
# Every evidence update is logged at DEBUG, which is useful while developing and noisy in
# production. Conversations are never logged.
%dev.quarkus.log.category."fr.lapetina.music".level=DEBUG
%test.quarkus.log.category."fr.lapetina.music".level=INFO
quarkus.smallrye-openapi.info-title=Leading Tone API
quarkus.smallrye-openapi.info-version=1.0.0
