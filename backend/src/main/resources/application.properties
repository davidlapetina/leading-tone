quarkus.application.name=music-teacher
# Off the usual 8080 so this can run alongside another service.
quarkus.http.port=${MUSIC_HTTP_PORT:8088}

# The Vite dev server and its preview server.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:4173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=content-type,accept

# ---------------------------------------------------------------- database
# Progress is kept in an H2 file under ./data. There is no database server to install, no
# container to run, and nothing to configure: start the application and your work is saved.
# Flyway owns the schema; Hibernate only validates that the mapping still fits it.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=tutor
quarkus.datasource.password=tutor
quarkus.datasource.jdbc.url=jdbc:h2:file:${MUSIC_DATA_DIR:./data}/leading-tone;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.datasource.devservices.enabled=false

# Tests run against an in-memory database, so the suite needs nothing installed at all.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:leading-tone;DB_CLOSE_DELAY=-1
%test.quarkus.flyway.clean-at-start=true

# ---------------------------------------------------------------- language model
# These are seed values only. On first start they are written into the settings table, and
# from then on the Settings screen is the source of truth — the model can be changed while
# the application is running, without a restart and without touching the environment.
music.defaults.model=qwen3:8b
music.defaults.base-url=http://localhost:11434
music.defaults.llm-enabled=true
%test.music.defaults.llm-enabled=false

# The extension supplies the Ollama client classes; the model itself is built in
# TutorAiFactory from the persisted settings, so its own configuration stays out of it.
quarkus.langchain4j.ollama.enable-integration=false

# Lets the end-to-end tests start a scenario from an empty learner model. Off in production.
music.dev.allow-reset=false
%dev.music.dev.allow-reset=true
%test.music.dev.allow-reset=true

# ---------------------------------------------------------------- observability
# Every evidence update is logged at DEBUG, which is useful while developing and noisy in
# production. Conversations are never logged.
%dev.quarkus.log.category."fr.lapetina.music".level=DEBUG
%test.quarkus.log.category."fr.lapetina.music".level=INFO
quarkus.smallrye-openapi.info-title=Leading Tone API
quarkus.smallrye-openapi.info-version=1.0.0
