quarkus.application.name=leading-tone
# Off the usual 8080 so this can run alongside another service.
quarkus.http.port=${MUSIC_HTTP_PORT:8088}

# The Vite dev server and its preview server.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:4173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=content-type,accept

# ---------------------------------------------------------------- database
# Progress is kept in an H2 file under ./data. There is no database server to install, no
# container to run, and nothing to configure: start the application and your work is saved.
# Flyway owns the schema; Hibernate only validates that the mapping still fits it.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=tutor
quarkus.datasource.password=tutor
# RETENTION_TIME=0 matters more than it looks. Ingesting a corpus inserts tens of thousands
# of rows at once, and with the default retention H2 keeps every superseded storage chunk:
# the file reached 853 MB for 173,000 rows that compact to 23 MB. Reclaiming as it goes
# keeps the data directory the size of the data.
quarkus.datasource.jdbc.url=jdbc:h2:file:${MUSIC_DATA_DIR:./data}/leading-tone;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;RETENTION_TIME=0
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.datasource.devservices.enabled=false

# Reclaim the space a bulk ingestion leaves behind. Off in tests, where the database is in
# memory and there is nothing to reclaim.
music.store.compact-on-shutdown=true
%test.music.store.compact-on-shutdown=false

# Tests run against an in-memory database, so the suite needs nothing installed at all.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:leading-tone;DB_CLOSE_DELAY=-1
%test.quarkus.flyway.clean-at-start=true

# ---------------------------------------------------------------- language model
# These are seed values only. On first start they are written into the settings table, and
# from then on the Settings screen is the source of truth — the model can be changed while
# the application is running, without a restart and without touching the environment.
music.defaults.model=qwen3:8b
music.defaults.base-url=http://localhost:11434
music.defaults.llm-enabled=true
%test.music.defaults.llm-enabled=false

# Retrieval is on, but inert until a source has actually been ingested: with no index the
# tutor simply gets no reference material and teaches from the theory engine as before.
music.defaults.knowledge-enabled=true
%test.music.defaults.knowledge-enabled=false

# The extension supplies the Ollama client classes; the model itself is built in
# TutorAiFactory from the persisted settings, so its own configuration stays out of it.
quarkus.langchain4j.ollama.enable-integration=false

# Starting over deletes everything the tutor has learned about you. It is allowed because
# this is your own copy on your own machine; the interface asks before doing it.
music.dev.allow-reset=true

# ---------------------------------------------------------------- observability
# Every evidence update is logged at DEBUG, which is useful while developing and noisy in
# production. Conversations are never logged.
%dev.quarkus.log.category."fr.lapetina.music".level=DEBUG
%test.quarkus.log.category."fr.lapetina.music".level=INFO
quarkus.smallrye-openapi.info-title=Leading Tone API
quarkus.smallrye-openapi.info-version=1.0.0

# ---------------------------------------------------------------- published sources
# Where downloaded sources, the search index and ingestion reports live. Alongside the
# H2 file, so one directory holds everything this application has learned or read.
music.knowledge.data-path=${MUSIC_DATA_DIR:./data}/knowledge
# Tests write their index under target/, so a test run never touches real data.
%test.music.knowledge.data-path=./target/test-knowledge

# Ingestion reaches the network, so it is an explicit act, never something that happens
# at startup. Only sources declared in knowledge-sources.yaml can be fetched at all.
music.knowledge.allow-ingest=true
%test.music.knowledge.allow-ingest=false
# The Pressbooks API refuses the default JDK user agent with HTTP 403.
music.knowledge.user-agent=Mozilla/5.0 (compatible; LeadingTone/1.0; +https://github.com/lapetina/leading-tone)
music.knowledge.http-timeout-seconds=30
music.knowledge.politeness-millis=400

# The embedding model runs in this JVM on ONNX Runtime. There is no embedding service and
# no Python. Turning it off leaves lexical (BM25) search working on its own.
music.knowledge.embedding.enabled=true
%test.music.knowledge.embedding.enabled=false
music.knowledge.embedding.model=bge-small-en-v1.5-q

# Chunks follow the shape of the writing, not a token count: conceptual integrity first.
music.knowledge.chunk.target-chars=1200
music.knowledge.chunk.max-chars=1800
music.knowledge.chunk.min-chars=250

# Hybrid ranking. Documented in docs/knowledge/retrieval.md; with no embedder the vector
# weight is treated as zero and the same code path yields pure BM25.
music.knowledge.retrieval.lexical-weight=0.55
music.knowledge.retrieval.vector-weight=0.45
music.knowledge.retrieval.concept-boost=0.35
music.knowledge.retrieval.takeaway-boost=0.20
music.knowledge.retrieval.candidates=40
music.knowledge.retrieval.top-k=4
music.knowledge.retrieval.max-per-document=2

# How much retrieved text may reach the model, and per passage.
# How many bars either side of a cited chord to engrave. One bar of context each way is
# usually enough to hear the progression in your head; a chord shown alone rarely is.
music.knowledge.score.context-before=1
music.knowledge.score.context-after=1

music.knowledge.prompt.max-chars=2600
music.knowledge.prompt.max-chars-per-chunk=900

# Lucene ships multi-release jars; without this the uber-jar silently loses its optimised
# mmap and vector paths. PackagedJarKnowledgeIT checks the built artefact for it.
quarkus.package.jar.manifest.attributes."Multi-Release"=true

# ---------------------------------------------------------------- packaging
# ONNX Runtime ships debug symbols for every platform it supports: 291 MB of Windows .pdb
# and 18 MB of macOS .dSYM, none of which is ever loaded at runtime on any operating system.
# The Windows one alone is larger than the uber-jar's 256 MB entry limit, so without this
# the single-jar build does not complete at all. Excluding them keeps the jar portable --
# every platform's actual native library is still inside it -- and removes 309 MB.
quarkus.package.jar.user-configured-ignored-entries=\
  ai/onnxruntime/native/win-x64/onnxruntime.pdb,\
  ai/onnxruntime/native/win-x64/onnxruntime4j_jni.pdb,\
  ai/onnxruntime/native/osx-aarch64/libonnxruntime.dylib.dSYM/Contents/Resources/DWARF/libonnxruntime.dylib,\
  ai/onnxruntime/native/osx-aarch64/libonnxruntime4j_jni.dylib.dSYM/Contents/Resources/DWARF/libonnxruntime4j_jni.dylib,\
  ai/onnxruntime/native/osx-x64/libonnxruntime.dylib.dSYM/Contents/Resources/DWARF/libonnxruntime.dylib,\
  ai/onnxruntime/native/osx-x64/libonnxruntime4j_jni.dylib.dSYM/Contents/Resources/DWARF/libonnxruntime4j_jni.dylib
