# Builds the installers people download.
#
# jpackage cannot cross-compile, so each installer is built on the system it is for. The
# three jobs are otherwise identical, which is the point: whatever goes wrong goes wrong on
# one platform only, and the other two still produce something.
#
# Deliberately no `make`: it is not on the path on the Windows runner, and the two commands
# it would run are one line each.
name: Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: dmg
          - os: windows-latest
            artifact: msi
          - os: ubuntu-latest
            artifact: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # A full JDK, not a JRE: the build needs jlink and jpackage, which only ship with one.
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the interface
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build the jar
        run: |
          cd backend
          ./mvnw --batch-mode package -DskipTests

      - name: Check the jar before wrapping it
        # Cheap, and it catches the failure that appears only in a packaged build: Lucene
        # resolves its codecs through META-INF/services, which an uber-jar has to merge.
        if: runner.os != 'Windows'
        run: ./scripts/verify-jar.sh

      - name: Build the installer
        # The tag is the version, without its leading v. Stripping it in the shell rather
        # than in an expression: GitHub Actions has no replace() function, and using one
        # stops the whole workflow from parsing, so nothing runs and nothing says why.
        run: |
          VERSION="1.0.0"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Building version $VERSION"
          APP_VERSION="$VERSION" ./scripts/package-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: leading-tone-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: installer
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          draft: true
          body: |
            Download the one for your machine. Nothing else to install — no Java, no Docker,
            no database. See RELEASE_NOTES.md for what is in this version.

            macOS and Windows will warn that the developer is unidentified, because these
            builds are not yet signed. On macOS, open System Settings → Privacy & Security
            and choose Open Anyway; on Windows, choose More info → Run anyway.
