services:

  postgres:
    image: postgres:17
    container_name: music-teacher-postgres
    environment:
      POSTGRES_DB: music
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
    ports:
      # 5432 is often already taken by another project's database, so this one sits
      # beside it. Override with MUSIC_DB_PORT if you would rather have the default.
      - "${MUSIC_DB_PORT:-5433}:5432"
    volumes:
      - music_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  music_postgres:
